<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <a class="navbar-brand" href="#">Quote Generator</a>
                <form class="search-form" role="search" id="search-form">
                    <input 
                        class="search-input" 
                        type="search" 
                        placeholder="Search quotes..." 
                        aria-label="Search quotes" 
                        id="search-input"
                    >
                    <button class="search-button" type="submit">Search</button>
                </form>
            </div>
        </nav>
    </header>

    <main>
        <section id="about">
            <h2>About</h2>
            <p>This quote generator allows users to get inspirational quotes with the click of a button!</p>
        </section>

        <section id="quotes">
            <h2>Select Your Mood</h2>
            <div class="mood-selector">
                <label for="mood-selector">Choose a mood:</label>
                <select id="mood-selector" aria-label="Mood selector">
                    <option value="all">All</option>
                    <option value="Motivation">Motivation</option>
                    <option value="Reflective">Reflective</option>
                    <option value="Courage">Courage</option>
                    <option value="Inspirational">Inspirational</option>
                    <option value="Hope">Hope</option>
                </select>
            </div>

            <div class="quote-container">
                <div class="quote-box">
                    <p id="quote">Click the button to get a quote!</p>
                    <div class="quote-buttons">
                        <button id="new-quote-btn" aria-label="Get a new quote">New Quote</button>
                        <button class="share-quote-btn" aria-label="Share this quote">Share</button>
                        <button class="like-quote-btn" aria-label="Like this quote">Like</button>
                        <button class="dislike-quote-btn" aria-label="Dislike this quote">Dislike</button>
                    </div>
                </div>

                <div class="quote-box">
                    <p id="quote-of-the-day">Quote of the Day:</p>
                    <button id="quote-of-the-day-btn" aria-label="Get the quote of the day">Get Quote of the Day</button>
                </div>
            </div>
        </section>

        <section id="add-quote-container">
            <h3>Add a New Quote</h3>
            <form id="add-quote-form">
                <label for="new-quote-text">Quote:</label>
                <input 
                    type="text" 
                    id="new-quote-text" 
                    placeholder="Enter the quote" 
                    required 
                    aria-label="New quote text"
                >
                <label for="new-quote-author">Author:</label>
                <input 
                    type="text" 
                    id="new-quote-author" 
                    placeholder="Enter the author" 
                    required 
                    aria-label="New quote author"
                >
                <label for="new-quote-category">Category:</label>
                <select id="new-quote-category" aria-label="New quote category">
                    <option value="">Select Category (optional)</option>
                    <option value="Motivation">Motivation</option>
                    <option value="Reflective">Reflective</option>
                    <option value="Courage">Courage</option>
                    <option value="Inspirational">Inspirational</option>
                    <option value="Hope">Hope</option>
                </select>
                <button type="submit" aria-label="Add new quote">Add Quote</button>
            </form>
            <p id="add-quote-message" aria-live="polite"></p>
        </section>

        <section id="quote-history">
            <h3>Your Quote History</h3>
            <ul id="history-list" class="history-list" aria-label="Quote history">
                <!-- History items will be populated here dynamically -->
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Quote Generator</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
